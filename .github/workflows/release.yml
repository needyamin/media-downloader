# Build protected binaries and publish a GitHub Release when you push a version tag.
#
# Usage:
#   git tag v2.0.1
#   git push origin v2.0.1
#
# Installed apps check https://github.com/needyamin/media-downloader/releases/latest
# and download MediaDownloader_Setup.exe (Windows) or the AppImage (Linux).

name: Release (Nuitka + AppImage)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 2.0.1) — required for manual runs"
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  PYTHONPATH: src

jobs:
  windows-nuitka:
    name: Windows (Nuitka + Inno Setup)
    runs-on: windows-latest
    env:
      MD_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync release version into app_flags.json
        shell: pwsh
        run: |
          $v = "${{ env.MD_RELEASE_VERSION }}".TrimStart("v")
          python -m desktop_tools.app.build_tools.release_ci sync-version

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka ordered-set zstandard
          python -m pip install -r src/desktop_tools/app/requirements.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer (Nuitka — no source in output)
        shell: pwsh
        env:
          MD_RELEASE_VERSION: ${{ env.MD_RELEASE_VERSION }}
        run: python -m desktop_tools.app.build_tools.nuitka

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/windows/MediaDownloader_Setup.exe
            release/windows/build-info.json
          if-no-files-found: error

  linux-appimage:
    name: Linux (PyInstaller + AppImage)
    runs-on: ubuntu-latest
    env:
      MD_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-tk python3-dev binutils \
            desktop-file-utils libfuse2 fuse \
            wget file

      - name: Sync release version into app_flags.json
        run: |
          python -m desktop_tools.app.build_tools.release_ci sync-version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r src/desktop_tools/app/requirements.txt

      - name: Build AppImage (compiled bundle — no .py source shipped)
        env:
          MD_RELEASE_VERSION: ${{ env.MD_RELEASE_VERSION }}
        run: python -m desktop_tools.app.build_tools.linux_appimage

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            release/linux/Media-Downloader-x86_64.AppImage
            release/linux/build-info.json
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: [windows-nuitka, linux-appimage]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Stage release files
        run: |
          mkdir -p release/staged
          cp dist/windows-installer/MediaDownloader_Setup.exe release/staged/
          cp dist/linux-appimage/Media-Downloader-x86_64.AppImage release/staged/
          cp dist/windows-installer/build-info.json release/staged/build-info-windows.json || true
          cp dist/linux-appimage/build-info.json release/staged/build-info-linux.json || true

      - name: Write SHA256 checksums
        run: |
          cd release/staged
          sha256sum MediaDownloader_Setup.exe Media-Downloader-x86_64.AppImage | tee SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          name: Media Downloader ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          files: |
            release/staged/MediaDownloader_Setup.exe
            release/staged/Media-Downloader-x86_64.AppImage
            release/staged/SHA256SUMS.txt
            release/staged/build-info-windows.json
            release/staged/build-info-linux.json
          fail_on_unmatched_files: true
