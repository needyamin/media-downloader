# Validate the project on every push/PR (no release artifacts).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/desktop_tools/app/requirements.txt

      - name: Smoke and script checks
        run: |
          python -m desktop_tools.tools.smoke_checks
          python -m desktop_tools.tools.script_checks
