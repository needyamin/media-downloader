# Validate the project on every push/PR (no release artifacts).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Linux GUI packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk libx11-6

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/desktop_tools/app/requirements.txt

      - name: Smoke and script checks
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            python -m desktop_tools.tools.smoke_checks
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            python -m desktop_tools.tools.script_checks
