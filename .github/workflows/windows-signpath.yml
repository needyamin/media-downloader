# Optional: code-sign Windows installer after a GitHub Release is published.
# Configure repository secrets/variables for SignPath (see release job in old docs).
#
# Primary build pipeline: .github/workflows/release.yml (Nuitka + Inno Setup).

name: Sign Windows Release (SignPath)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  signpath:
    runs-on: windows-latest
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - name: Download release installer
        uses: robinraju/release-downloader@v1
        with:
          latest: true
          fileName: MediaDownloader_Setup.exe
          out-file-path: unsigned

      - name: Upload unsigned for SignPath
        id: upload_unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-installer
          path: unsigned/MediaDownloader_Setup.exe
          if-no-files-found: error

      - name: Sign with SignPath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'windows-release' }}
          github-artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Attach signed installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: signed/**/*
          fail_on_unmatched_files: true
